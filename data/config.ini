# ULTIMESH configuration file


# === System Identity ===
node_id = NODE001        ; Unique ID for this node (used for DM, routing)
user_name = Tom          ; Optional human-readable name
location_enabled = false ; Enable sending location packets (future)

# === LoRa Radio Settings ===
region = AU              ; AU, US, EU, etc.
frequency = 915E6        ; Override default frequency in Hz
spread_factor = 7        ; 6–12: Higher = longer range, slower speed
tx_power = 17            ; Transmission power (dBm)

# === Message Behavior ===
default_mode = pager     ; pager, top, chat (future)
send_delay_ms = 250      ; Delay between LoRa packets
max_packet_size = 192    ; Max bytes per message (before split)

# === UI / Shell ===
show_help_on_start = true
default_token_map = /tokens_shell.txt
shell_mode=:
show_top=true
lora_node_id=ULTI-01
startup_command=top
editor_help=1
enable_command_history = true
enable_tab_completion  = true
max_history_entries    = 10
max_tab_results        = 8


# === OLED Display ===
oled_lora_display_ms = 5000      ; Show incoming messages for 5s
oled_flash_on_lora = true        ; Flash or show popup when LoRa msg arrives
